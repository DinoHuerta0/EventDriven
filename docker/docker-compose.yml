name: event-driven

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  order-placement:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: event-driven:latest
    command: ["python", "service/order_placement.py"]
    volumes:
      - ../logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
  payment:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: event-driven:latest
    command: ["python", "service/payment.py"]
    volumes:
      - ../logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy

  order-fulfillment:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: event-driven:latest
    command: ["python", "service/order_fulfillment.py"]
    volumes:
      - ../logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    
  notification:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: event-driven:latest
    command: ["python", "service/notification.py"]
    volumes:
      - ../logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: event-driven:latest
    profiles: ["cli"]
    command: ["python", "place_order.py"]
    volumes:
      - ../logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy